appId: com.fullstackacademy.desktop
productName: FullStack Academy
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.education
linux:
  target: [AppImage, deb]
  category: Education

appId: com.fullstackacademy.desktop
productName: FullStack Academy
copyright: Copyright © 2026 FullStack Academy contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - LICENSE

asar: true
compression: maximum
npmRebuild: false
# Keep only the locales the UI actually needs (smaller download, fewer files).
electronLanguages:
  - en-US
  - fa
# Harden the packaged runtime: no ELECTRON_RUN_AS_NODE, no NODE_OPTIONS,
# no inspector flags, and only the validated app.asar may be loaded.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
artifactName: FullStackAcademy-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FullStack Academy
  artifactName: FullStackAcademy-${version}-windows-setup.${ext}

portable:
  artifactName: FullStackAcademy-${version}-windows-portable.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.education
  identity: null
  hardenedRuntime: false
  darkModeSupport: true

dmg:
  artifactName: FullStackAcademy-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  maintainer: DashAkoul <AkoulDash@outlook.com>
  synopsis: Persian full-stack learning path with AI code review
  description: An offline-first desktop academy that guides beginners to professional full-stack developers with Persian lessons, real-world exercises and AI code review.

appImage:
  artifactName: FullStackAcademy-${version}-linux-${arch}.${ext}

deb:
  artifactName: FullStackAcademy-${version}-linux-${arch}.${ext}
